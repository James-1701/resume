<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      document.title = "James Hollister's Resume";
    </script>
    <title>James Hollister's Resume</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/simple-icons-font@v16/font/simple-icons.min.css"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="resume-container">
      <h1>James Hollister</h1>

      <div class="sidebar">
        <div id="contact"></div>
        <div id="skills"></div>
      </div>

      <div class="main-content">
        <div id="education"></div>
        <div id="experience"></div>
        <div id="projects"></div>
        <div id="foss"></div>
        <div id="footer"></div>
      </div>

      <script>
        async function loadPartial(id, file) {
          const response = await fetch(file);

          if (!response.ok) {
            throw new Error(`Failed to load ${file}: ${response.status}`);
          }

          document
            .getElementById(id)
            .insertAdjacentHTML("beforeend", await response.text());
        }

        async function loadResume() {
          await loadPartial("contact", "resume/contact.html");
          await loadPartial("skills", "resume/skills/base.html");
          await loadPartial("education", "resume/education.html");
          await loadPartial("experience", "resume/experience/base.html");
          await loadPartial("projects", "resume/projects.html");
          await loadPartial("foss", "resume/foss.html");

          // await loadPartial("skills-languages", "resume/skills/web.html");
          // await loadPartial("skills-section", "resume/skills/engineering.html");
          await loadPartial("experience-section", "resume/experience/hs.html");

          // await loadPartial("footer", "resume/footer.html");
        }

        loadResume().catch(console.error);
      </script>
    </div>
  </body>
</html>
